# ============================================================
# FLINT Experiments - Master Configuration
# ============================================================

# --- 数据相关 ---
data:
  raw_dir: "./data/raw"              # ETH-UCY / SDD 原始数据
  processed_dir: "./data/processed"  # 处理后的数据
  sft_dir: "./data/sft"              # SFT 格式数据
  resolution: [360, 480]             # 图像分辨率 [H, W]
  fps: 2.5                           # 标注帧率
  clip_length: 25                    # 每个clip的帧数
  train_ratio: 0.9
  datasets:
    - eth
    - hotel
    - univ
    - zara1
    - zara2
    - sdd                            # 新增SDD数据集

# --- Coordinate Tokenizer ---
tokenizer:
  mode: "absolute"                   # absolute | relative | polar
  # 绝对坐标参数
  absolute:
    bin_size: 5
    x_bins: 96                       # 480 / 5
    y_bins: 72                       # 360 / 5
  # 相对坐标参数
  relative:
    max_displacement: 50             # 最大位移像素
    bin_size: 2                      # 位移分辨率
    num_bins: 51                     # [-50, -48, ..., 0, ..., 48, 50]
  # 极坐标参数
  polar:
    max_distance: 60
    dist_bins: 30                    # 距离分辨率
    angle_bins: 36                   # 角度分辨率 (每10度)

# --- 标注API ---
annotation:
  provider: "openai"                 # openai | google | local
  model: "gpt-4o-mini"              # gpt-4o-mini (便宜) | gpt-4o | gemini-1.5-flash
  batch_size: 10
  max_retries: 3
  temperature: 0.3
  local_model: "Qwen/Qwen2.5-VL-7B-Instruct"  # 本地VLM (免费)

# --- 训练 ---
training:
  backbone: "Qwen/Qwen3-8B"         # LLM backbone
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                     "gate_proj", "up_proj", "down_proj"]
  epochs: 20
  batch_size: 3
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler: "linear"
  warmup_ratio: 0.05
  max_seq_length: 8192
  # 物理约束loss权重
  physics_loss:
    enabled: true
    collision_weight: 0.1
    smoothness_weight: 0.05
    walkability_weight: 0.2
  output_dir: "./outputs"

# --- 评估 ---
evaluation:
  num_samples_per_prompt: 20         # 每个prompt采样K次 (多样性评估)
  temperature: 0.8                   # 采样温度
  top_p: 0.95
  llm_judges:
    - "gpt-4o"
    - "deepseek-chat"
    - "gemini-1.5-pro"
  diversity_metrics:
    - "atd"                          # Average Trajectory Diversity
    - "fdd"                          # Final Displacement Diversity
    - "coverage"                     # Grid Coverage
    - "entropy"                      # Endpoint Entropy
  quality_metrics:
    - "jade"                         # Joint Average Displacement Error
    - "jfde"                         # Joint Final Displacement Error
    - "collision_rate"
    - "smoothness"

# --- 消融实验 ---
ablation:
  tokenizer_modes: ["absolute", "relative", "polar"]
  backbones: ["Qwen/Qwen3-8B", "meta-llama/Llama-3.1-8B-Instruct"]
  physics_loss_variants:
    - "none"
    - "collision_only"
    - "smoothness_only"
    - "walkability_only"
    - "all"

# --- 下游任务 ---
downstream:
  trajectory_prediction:
    model: "social_stgcnn"
    obs_len: 8
    pred_len: 12
    augment_ratios: [0.0, 0.5, 1.0, 2.0]  # 增强倍率
