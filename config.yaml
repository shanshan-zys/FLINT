# FLINT Configuration

data:
  raw_dir: "./data/trajectories"
  scenario_dir: "./data/scenarios"
  resolution: [480, 640]        # [H, W]
  fps: 2.5
  clip_length: 25
  train_ratio: 0.8
  map_grid_size: 10             # walkable area grid 下采样步长
  datasets: [eth, hotel, univ, zara1, zara2]

tokenizer:
  bin_size: 5
  x_bins: 128                   # 640 / 5
  y_bins: 96                    # 480 / 5

training:
  backbone: "Qwen/Qwen3-8B-Instruct"
  max_seq_length: 8192
  epochs: 20
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  early_stopping_patience: 3
  physics_loss:
    collision_weight: 0.1
    smoothness_weight: 0.05
    walkable_weight: 0.05
    collision_threshold: 10.0
  output_dir: "./outputs"

evaluation:
  num_samples: 20
  temperature: 0.8
  top_p: 0.95
  llm_judges:
    - deepseek-chat

downstream:
  obs_len: 8
  pred_len: 12
  predictor_epochs: 50
  predictor_lr: 1.0e-3
  predictor_batch_size: 64
